<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Gym Tracker</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="GymTracker">
  <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/2936/2936886.png">
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --success: #22c55e;
      --border: #334155;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0;
      padding: env(safe-area-inset-top, 20px) 16px env(safe-area-inset-bottom, 20px);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    header {
      padding: 16px 0 12px;
      text-align: center;
    }
    h1 { margin: 0; font-size: 1.5rem; font-weight: 800; color: #fff; }
    .split-selector {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 20px;
    }
    .btn-split {
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 14px 10px;
      border-radius: 12px;
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-split.active {
      background: var(--accent);
      border-color: var(--accent);
      box-shadow: 0 4px 14px rgba(59, 130, 246, 0.4);
    }
    .card {
      background: var(--card-bg);
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 14px;
      border: 1px solid var(--border);
    }
    .exercise-title {
      font-size: 1.05rem;
      font-weight: 700;
      margin: 0 0 2px 0;
    }
    .exercise-meta {
      font-size: 0.8rem;
      color: var(--muted);
      margin-bottom: 12px;
    }
    .set-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 8px;
    }
    .set-tag {
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--muted);
      width: 48px;
    }
    .input-wrap {
      display: flex;
      align-items: center;
      background: #0f172a;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 4px 8px;
      flex: 1;
    }
    .input-wrap input {
      width: 100%;
      background: transparent;
      border: none;
      color: #fff;
      font-size: 0.95rem;
      font-weight: 600;
      text-align: center;
      outline: none;
    }
    .input-wrap span {
      font-size: 0.75rem;
      color: var(--muted);
      margin-left: 2px;
    }
    .btn-check {
      background: #334155;
      border: none;
      color: #fff;
      width: 36px;
      height: 36px;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
    }
    .btn-check.done {
      background: var(--success);
    }
    #timer-container {
      position: fixed;
      bottom: 20px;
      left: 16px;
      right: 16px;
      background: rgba(30, 41, 59, 0.95);
      backdrop-filter: blur(10px);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 12px 16px;
      display: none;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
    }
    #timer-display {
      font-size: 1.25rem;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      color: #38bdf8;
    }
    .btn-action {
      background: var(--accent);
      border: none;
      color: #fff;
      padding: 8px 14px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <header>
    <h1>Gym Tracker</h1>
  </header>

  <div class="split-selector">
    <button class="btn-split active" onclick="switchRoutine('upper')">Upper Body</button>
    <button class="btn-split" onclick="switchRoutine('lower')">Lower Body</button>
  </div>

  <div id="exercise-list"></div>

  <div id="timer-container">
    <div>
      <div style="font-size:0.75rem; color:var(--muted);">Recupero</div>
      <div id="timer-display">02:00</div>
    </div>
    <div style="display:flex; gap:8px;">
      <button class="btn-action" style="background:#475569;" onclick="addTimer(30)">+30s</button>
      <button class="btn-action" style="background:#ef4444;" onclick="stopTimer()">Chiudi</button>
    </div>
  </div>

  <script>
    const routines = {
      upper: [
        { name: "Panca Inclinata", sets: 2, reps: "6-8", rest: 150, note: "Fermo al petto solido" },
        { name: "Rematore Bilanciere/Cavo", sets: 2, reps: "6-8", rest: 150, note: "Gomiti verso il bacino" },
        { name: "Pec Deck Fly", sets: 2, reps: "6-8", rest: 120, note: "1s picco di contrazione" },
        { name: "Pull-ups (Trazioni)", sets: 2, reps: "MAX", rest: 120, note: "RIR 1 (stop prima del cedimento)" },
        { name: "Cable Lateral Raises", sets: 3, reps: "10-12", rest: 90, note: "Movimento fluido controllato" },
        { name: "Panca Scott Bilanciere", sets: 3, reps: "6-8", rest: 120, note: "Braccia ferme sul pad" },
        { name: "Spinte Tricipiti Cavi", sets: 3, reps: "6-8", rest: 120, note: "Gomiti bloccati ai fianchi" }
      ],
      lower: [
        { name: "Leg Extension", sets: 2, reps: "8-10", rest: 120, note: "Pre-affaticamento quadricipiti" },
        { name: "Leg Press Orizz./45°", sets: 2, reps: "8-10", rest: 150, note: "Piedi medio-alti, stop a 90° (Knee-safe)" },
        { name: "Hip Thrust", sets: 2, reps: "6-8", rest: 150, note: "Piedi a 90° in cima, glutei" },
        { name: "Back Extension 45°", sets: 3, reps: "8-10", rest: 120, note: "Femorali/glutei in allungamento" },
        { name: "Hip Adductor Machine", sets: 2, reps: "10-12", rest: 90, note: "1s isometrica in chiusura" },
        { name: "Calf Raise Pressa/Seduto", sets: 3, reps: "10-12", rest: 90, note: "2s fermo in massimo allungamento" }
      ]
    };

    let currentRoutineKey = 'upper';
    let timerInterval = null;
    let timerSeconds = 0;

    function renderExercises() {
      const list = document.getElementById('exercise-list');
      list.innerHTML = '';
      const exercises = routines[currentRoutineKey];

      exercises.forEach((ex, exIndex) => {
        const card = document.createElement('div');
        card.className = 'card';

        let setsHtml = '';
        for (let s = 1; s <= ex.sets; s++) {
          const keyWeight = `${currentRoutineKey}_ex${exIndex}_s${s}_w`;
          const keyReps = `${currentRoutineKey}_ex${exIndex}_s${s}_r`;
          const savedW = localStorage.getItem(keyWeight) || '';
          const savedR = localStorage.getItem(keyReps) || '';

          setsHtml += `
            <div class="set-row">
              <span class="set-tag">Set ${s}</span>
              <div class="input-wrap">
                <input type="number" step="0.5" placeholder="0" value="${savedW}" 
                  onchange="saveData('${keyWeight}', this.value)">
                <span>kg</span>
              </div>
              <div class="input-wrap">
                <input type="number" placeholder="0" value="${savedR}" 
                  onchange="saveData('${keyReps}', this.value)">
                <span>reps</span>
              </div>
              <button class="btn-check" onclick="toggleSet(this, ${ex.rest})">✓</button>
            </div>
          `;
        }

        card.innerHTML = `
          <div class="exercise-title">${ex.name}</div>
          <div class="exercise-meta">${ex.sets} serie × ${ex.reps} rip • ${ex.note}</div>
          ${setsHtml}
        `;
        list.appendChild(card);
      });
    }

    function switchRoutine(type) {
      currentRoutineKey = type;
      document.querySelectorAll('.btn-split').forEach(b => b.classList.remove('active'));
      event.target.classList.add('active');
      renderExercises();
    }

    function saveData(key, value) {
      localStorage.setItem(key, value);
    }

    function toggleSet(btn, restSeconds) {
      btn.classList.toggle('done');
      if (btn.classList.contains('done')) {
        if (navigator.vibrate) navigator.vibrate(50);
        startTimer(restSeconds);
      }
    }

    function startTimer(seconds) {
      clearInterval(timerInterval);
      timerSeconds = seconds;
      const box = document.getElementById('timer-container');
      box.style.display = 'flex';
      updateTimerDisplay();

      timerInterval = setInterval(() => {
        timerSeconds--;
        updateTimerDisplay();
        if (timerSeconds <= 0) {
          clearInterval(timerInterval);
          if (navigator.vibrate) navigator.vibrate([100, 50, 100]);
        }
      }, 1000);
    }

    function updateTimerDisplay() {
      const mins = Math.floor(timerSeconds / 60);
      const secs = timerSeconds % 60;
      document.getElementById('timer-display').innerText = 
        `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
    }

    function addTimer(sec) {
      timerSeconds += sec;
      updateTimerDisplay();
    }

    function stopTimer() {
      clearInterval(timerInterval);
      document.getElementById('timer-container').style.display = 'none';
    }

    renderExercises();
  </script>
</body>
</html>
